<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vocab cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #F7F5F0;
    --surface:  #FFFFFF;
    --border:   #E2DDD6;
    --border2:  #C8C3BA;
    --text:     #1C1A17;
    --muted:    #6B6760;
    --hint:     #A09C97;
    --accent:   #2D6A4F;
    --accent-l: #D8EDDF;
    --accent-d: #1B4332;
    --red:      #C0392B;
    --red-l:    #FDECEA;
    --tag-bg:   #EAF3DE;
    --tag-fg:   #2D6A4F;
    --radius:   10px;
    --radius-lg:14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:       #131210;
      --surface:  #1E1C19;
      --border:   #302E2A;
      --border2:  #464340;
      --text:     #F0EDE8;
      --muted:    #9A9690;
      --hint:     #5C5A56;
      --accent:   #52B788;
      --accent-l: #1B3A2E;
      --accent-d: #95D5B2;
      --red:      #E57373;
      --red-l:    #2D1A1A;
      --tag-bg:   #1B3A2E;
      --tag-fg:   #95D5B2;
    }
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 16px; }
  body {
    font-family: 'DM Sans', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
  }

  /* ── Layout ── */
  #app { max-width: 860px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }

  /* ── Header ── */
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 2rem;
    flex-wrap: wrap;
    gap: 1rem;
  }
  .logo {
    font-family: 'Lora', Georgia, serif;
    font-size: 1.75rem;
    font-weight: 400;
    letter-spacing: -0.02em;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo svg { opacity: 0.7; }
  .logo-count {
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 400;
    color: var(--muted);
    background: var(--border);
    padding: 2px 8px;
    border-radius: 99px;
    margin-left: 4px;
    vertical-align: middle;
  }

  /* ── Controls ── */
  .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 1.25rem; }
  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 180px;
  }
  .search-wrap svg {
    position: absolute;
    left: 11px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--hint);
    pointer-events: none;
  }
  input[type="text"], textarea {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color .15s;
    width: 100%;
  }
  input[type="text"]:focus, textarea:focus { border-color: var(--accent); }
  #search { padding: 9px 12px 9px 36px; }
  .btn {
    padding: 8px 16px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    border-radius: var(--radius);
    border: 1px solid var(--border2);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background .12s, border-color .12s;
    white-space: nowrap;
  }
  .btn:hover { background: var(--bg); }
  .btn-primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent-d);
  }
  .btn-primary:hover { filter: brightness(1.08); }

  /* ── Tag filter ── */
  .tag-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 1.5rem; min-height: 28px; }
  .tag-row-label { font-size: 11px; color: var(--hint); text-transform: uppercase; letter-spacing: .06em; }
  .tag-pill {
    font-size: 12px;
    padding: 3px 11px;
    border-radius: 99px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    transition: all .12s;
  }
  .tag-pill:hover { border-color: var(--accent); color: var(--accent); }
  .tag-pill.active { background: var(--tag-bg); color: var(--tag-fg); border-color: var(--accent); font-weight: 500; }

  /* ── Divider ── */
  .divider { border: none; border-top: 1px solid var(--border); margin-bottom: 1.5rem; }

  /* ── Cards grid ── */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1.1rem 1.2rem;
    cursor: pointer;
    transition: border-color .15s, transform .12s;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .card-word {
    font-family: 'Lora', serif;
    font-size: 1.1rem;
    font-weight: 500;
    color: var(--text);
    line-height: 1.3;
  }
  .card-note {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.55;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    flex: 1;
  }
  .card-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
  .card-tag {
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 99px;
    background: var(--tag-bg);
    color: var(--tag-fg);
  }
  .card-date { font-size: 11px; color: var(--hint); margin-top: 4px; }

  /* ── Empty state ── */
  .empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 4rem 1rem;
    color: var(--muted);
  }
  .empty svg { opacity: .3; margin-bottom: 1rem; }
  .empty p { font-size: 15px; }
  .empty small { font-size: 13px; color: var(--hint); }

  /* ── Modal ── */
  .modal-backdrop {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,.45);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    backdrop-filter: blur(2px);
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: var(--radius-lg);
    padding: 1.75rem;
    width: 100%;
    max-width: 460px;
    max-height: 90vh;
    overflow-y: auto;
    animation: pop .15s ease;
  }
  @keyframes pop { from { transform: scale(.95); opacity:0; } to { transform: scale(1); opacity:1; } }
  .modal-title {
    font-family: 'Lora', serif;
    font-size: 1.4rem;
    font-weight: 400;
    color: var(--text);
    margin-bottom: 1.25rem;
    line-height: 1.3;
  }
  .field { margin-bottom: 1.1rem; }
  .field label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 5px; letter-spacing: .02em; }
  .field input[type="text"] { padding: 9px 11px; }
  .field textarea { padding: 9px 11px; resize: vertical; min-height: 90px; }
  .field-hint { font-size: 11px; color: var(--hint); margin-top: 4px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 1.4rem; }
  .modal-actions-split { display: flex; justify-content: space-between; align-items: center; margin-top: 1.4rem; }
  .btn-danger {
    background: transparent;
    color: var(--red);
    border-color: transparent;
    padding: 8px 12px;
  }
  .btn-danger:hover { background: var(--red-l); }

  /* Detail view */
  .detail-word {
    font-family: 'Lora', serif;
    font-size: 1.8rem;
    font-weight: 400;
    font-style: italic;
    color: var(--text);
    margin-bottom: .5rem;
    line-height: 1.2;
  }
  .detail-meta { font-size: 12px; color: var(--hint); margin-bottom: 1rem; }
  .detail-note {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.75;
    white-space: pre-wrap;
    margin-bottom: 1rem;
    padding: 1rem;
    background: var(--bg);
    border-radius: var(--radius);
    border-left: 3px solid var(--accent);
    font-family: 'DM Sans', sans-serif;
  }
  .detail-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 1.25rem; }
  .detail-tag {
    font-size: 12px;
    padding: 3px 11px;
    border-radius: 99px;
    background: var(--tag-bg);
    color: var(--tag-fg);
  }
  .sep { border: none; border-top: 1px solid var(--border); margin: 1.25rem 0; }

  /* stats bar */
  .stats { font-size: 12px; color: var(--hint); text-align: right; margin-bottom: .5rem; }

  /* Export/import */
  #file-input { display: none; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="2" y="5" width="20" height="14" rx="2"/>
        <path d="M8 5v14M2 10h6M2 14h6"/>
      </svg>
      vocab cards
      <span class="logo-count" id="total-count">0</span>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" onclick="exportData()" title="Export to JSON file">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        export
      </button>
      <button class="btn" onclick="resetData()" title="Reset deck to original JSON data">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1015.3-8.7"/><path d="M3 4v5h5"/></svg>
        reset
      </button>
      <button class="btn btn-primary" onclick="openAdd()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        new card
      </button>
    </div>
  </header>

  <div class="controls">
    <div class="search-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="search" placeholder="search words, notes, or tags…" oninput="render()" autocomplete="off" spellcheck="false">
    </div>
  </div>

  <div class="tag-row" id="tag-row"></div>
  <hr class="divider">
  <div class="stats" id="stats"></div>
  <div class="grid" id="grid"></div>
</div>

<!-- Modal -->
<div class="modal-backdrop" id="modal-backdrop" onclick="backdropClick(event)">
  <div class="modal" id="modal-content"></div>
</div>

<script>
const STORE = 'vocabcards_v2';
let cards = [];
let activeTag = null;

async function load() {
  try {
    const saved = localStorage.getItem(STORE);
    if (saved) {
      const parsed = JSON.parse(saved);
      if (Array.isArray(parsed)) {
        cards = parsed;
        return;
      }
    }
  } catch (e) {
    console.warn('Could not read saved deck, falling back to vocab-cards.json.', e);
  }

  try {
    const res = await fetch('./vocab-cards.json', { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    if (Array.isArray(data)) {
      cards = data;
      save();
      return;
    }
  } catch (e) {
    console.warn('Could not load vocab-cards.json; deck will stay empty until you add a card.', e);
  }

  cards = [];
}
function save() { localStorage.setItem(STORE, JSON.stringify(cards)); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function esc(s) {
  return String(s||'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function parseTags(s) { return s.split(',').map(t => t.trim()).filter(Boolean); }
function fmtDate(ts) {
  if (!ts) return '';
  return new Date(ts).toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' });
}

function allTags() {
  const m = new Map();
  cards.forEach(c => (c.tags||[]).forEach(t => m.set(t, (m.get(t)||0)+1)));
  return [...m.entries()].sort((a,b) => b[1]-a[1]).map(([t]) => t);
}

function filtered() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  return cards.filter(c => {
    const tagOk = activeTag ? (c.tags||[]).includes(activeTag) : true;
    if (!q) return tagOk;
    return tagOk && (
      c.word.toLowerCase().includes(q) ||
      (c.note||'').toLowerCase().includes(q) ||
      (c.tags||[]).some(t => t.toLowerCase().includes(q))
    );
  });
}

function render() {
  renderTagRow();
  renderGrid();
  document.getElementById('total-count').textContent = cards.length;
}

function renderTagRow() {
  const tags = allTags();
  const row = document.getElementById('tag-row');
  if (!tags.length) { row.innerHTML = ''; return; }
  let html = '<span class="tag-row-label">tags</span>';
  tags.forEach(t => {
    html += `<button class="tag-pill${activeTag===t?' active':''}" onclick="toggleTag('${esc(t)}')">${esc(t)}</button>`;
  });
  if (activeTag) {
    html += `<button class="tag-pill active" style="background:var(--red-l);color:var(--red);border-color:var(--red)" onclick="toggleTag(null)">✕ clear</button>`;
  }
  row.innerHTML = html;
}

function toggleTag(t) { activeTag = activeTag === t ? null : t; render(); }

function renderGrid() {
  const list = filtered();
  const stats = document.getElementById('stats');
  const grid = document.getElementById('grid');

  const q = document.getElementById('search').value.trim();
  stats.textContent = (q || activeTag)
    ? `${list.length} of ${cards.length} card${cards.length!==1?'s':''}`
    : '';

  if (!list.length) {
    grid.innerHTML = `<div class="empty">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M8 5v14M2 10h6M2 14h6"/></svg>
      <p>${cards.length ? 'no cards match your search' : 'your deck is empty'}</p>
      <small>${cards.length ? 'try different keywords' : 'click "new card" to add your first word'}</small>
    </div>`;
    return;
  }

  grid.innerHTML = list.map(c => `
    <div class="card" onclick="openDetail('${c.id}')">
      <div class="card-word">${esc(c.word)}</div>
      ${c.note ? `<div class="card-note">${esc(c.note)}</div>` : ''}
      <div class="card-tags">${(c.tags||[]).map(t=>`<span class="card-tag">${esc(t)}</span>`).join('')}</div>
      <div class="card-date">${fmtDate(c.created)}</div>
    </div>
  `).join('');
}

// ── Modal helpers ──
function openModal(html) {
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-backdrop').classList.add('open');
  setTimeout(() => { const f = document.getElementById('modal-content').querySelector('input,textarea'); if(f) f.focus(); }, 60);
}
function closeModal() { document.getElementById('modal-backdrop').classList.remove('open'); }
function backdropClick(e) { if (e.target === document.getElementById('modal-backdrop')) closeModal(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ── Add ──
function openAdd() {
  openModal(`
    <div class="modal-title">new card</div>
    <div class="field">
      <label>word *</label>
      <input type="text" id="m-word" placeholder="e.g. ephemeral">
    </div>
    <div class="field">
      <label>notes</label>
      <textarea id="m-note" placeholder="definition, example sentences, etymology…"></textarea>
    </div>
    <div class="field">
      <label>tags</label>
      <input type="text" id="m-tags" placeholder="adjective, literature, french">
      <div class="field-hint">separate tags with commas</div>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">cancel</button>
      <button class="btn btn-primary" onclick="addCard()">save card</button>
    </div>
  `);
}

function addCard() {
  const word = (document.getElementById('m-word').value||'').trim();
  if (!word) { document.getElementById('m-word').style.borderColor='var(--red)'; return; }
  const note = (document.getElementById('m-note').value||'').trim();
  const tags = parseTags(document.getElementById('m-tags').value||'');
  cards.unshift({ id: uid(), word, note, tags, created: Date.now() });
  save(); closeModal(); render();
}

// ── Detail ──
function openDetail(id) {
  const c = cards.find(x => x.id === id); if (!c) return;
  const tagsHtml = (c.tags||[]).map(t => `<span class="detail-tag">${esc(t)}</span>`).join('');
  openModal(`
    <div class="detail-word">${esc(c.word)}</div>
    <div class="detail-meta">added ${fmtDate(c.created)}</div>
    ${c.note ? `<div class="detail-note">${esc(c.note)}</div>` : ''}
    ${tagsHtml ? `<div class="detail-tags">${tagsHtml}</div>` : ''}
    <hr class="sep">
    <div class="modal-actions-split">
      <button class="btn btn-danger" onclick="deleteCard('${id}')">delete</button>
      <div style="display:flex;gap:8px">
        <button class="btn" onclick="closeModal()">close</button>
        <button class="btn btn-primary" onclick="openEdit('${id}')">edit</button>
      </div>
    </div>
  `);
}

// ── Edit ──
function openEdit(id) {
  const c = cards.find(x => x.id === id); if (!c) return;
  openModal(`
    <div class="modal-title">edit card</div>
    <div class="field">
      <label>word *</label>
      <input type="text" id="m-word" value="${esc(c.word)}">
    </div>
    <div class="field">
      <label>notes</label>
      <textarea id="m-note">${esc(c.note||'')}</textarea>
    </div>
    <div class="field">
      <label>tags</label>
      <input type="text" id="m-tags" value="${esc((c.tags||[]).join(', '))}">
      <div class="field-hint">separate tags with commas</div>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="openDetail('${id}')">cancel</button>
      <button class="btn btn-primary" onclick="saveEdit('${id}')">save changes</button>
    </div>
  `);
}

function saveEdit(id) {
  const word = (document.getElementById('m-word').value||'').trim();
  if (!word) { document.getElementById('m-word').style.borderColor='var(--red)'; return; }
  const note = (document.getElementById('m-note').value||'').trim();
  const tags = parseTags(document.getElementById('m-tags').value||'');
  const c = cards.find(x => x.id === id); if (!c) return;
  Object.assign(c, { word, note, tags, updated: Date.now() });
  save(); closeModal(); render();
}

// ── Delete ──
function deleteCard(id) {
  if (!confirm('Delete this card? This cannot be undone.')) return;
  cards = cards.filter(x => x.id !== id);
  save(); closeModal(); render();
}

// ── Export / Reset ──
function exportData() {
  const blob = new Blob([JSON.stringify(cards, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'vocab-cards-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
}

async function resetData() {
  if (!confirm('Reset the deck to the original JSON data? This will overwrite your current local changes.')) return;

  try {
    const res = await fetch('./vocab-cards.json', { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    if (!Array.isArray(data)) throw new Error('invalid format');

    cards = data;
    save();
    render();
    alert('Deck restored to the original JSON file.');
  } catch (err) {
    alert('Could not reset from the original file.');
  }
}

// ── keyboard shortcut ──
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
    e.preventDefault();
    document.getElementById('search').focus();
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'n' && !document.getElementById('modal-backdrop').classList.contains('open')) {
    e.preventDefault();
    openAdd();
  }
});

load().then(render).catch(() => render());
</script>
</body>
</html>
